<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="300" height="300">
  <!-- Rombo principal color naranja Git -->
  <rect x="18" y="18" width="64" height="64" rx="8" transform="rotate(45 50 50)" fill="#F1502F" />
  
  <!-- Nodos de los commits (Círculos) -->
  <circle cx="43" cy="71" r="6.5" fill="#ffffff" />
  <circle cx="43" cy="29" r="6.5" fill="#ffffff" />
  <circle cx="65" cy="50" r="6.5" fill="#ffffff" />
  
  <!-- Líneas que conectan las ramas -->
  <line x1="43" y1="71" x2="43" y2="29" stroke="#ffffff" stroke-width="4.5" />
  <line x1="43" y1="29" x2="65" y2="50" stroke="#ffffff" stroke-width="4.5" />
</svg>
